name: Publish AZ RemoteConnect Preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate AZ RemoteConnect icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python branding/build_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available from Google.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore release signing key (optional, never printed)
        env:
          AZ_KEYSTORE_B64: ${{ secrets.AZ_KEYSTORE_B64 }}
          AZ_KEYSTORE_PASSWORD: ${{ secrets.AZ_KEYSTORE_PASSWORD }}
          AZ_KEY_ALIAS: ${{ secrets.AZ_KEY_ALIAS }}
          AZ_KEY_PASSWORD: ${{ secrets.AZ_KEY_PASSWORD }}
        run: |
          if [ -n "$AZ_KEYSTORE_B64" ] && [ -n "$AZ_KEYSTORE_PASSWORD" ] && [ -n "$AZ_KEY_ALIAS" ] && [ -n "$AZ_KEY_PASSWORD" ]; then
            mkdir -p android/signing
            printf '%s' "$AZ_KEYSTORE_B64" | base64 --decode > android/signing/upload.jks
            echo "AZ_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/signing/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build viewer APK and full AAB
        env:
          AZ_KEYSTORE_PASSWORD: ${{ secrets.AZ_KEYSTORE_PASSWORD }}
          AZ_KEY_ALIAS: ${{ secrets.AZ_KEY_ALIAS }}
          AZ_KEY_PASSWORD: ${{ secrets.AZ_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleViewerDebug bundleFullRelease
      - run: cp android/app/build/outputs/apk/viewer/debug/app-viewer-debug.apk AZ-RemoteConnect-Viewer-debug.apk
      - name: Include Play-signed AAB only if signing secrets are complete
        if: ${{ env.AZ_KEYSTORE_PATH != '' }}
        shell: bash
        run: cp android/app/build/outputs/bundle/fullRelease/app-full-release.aab AZ-RemoteConnect-Full-Play-signed.aab
      - uses: actions/upload-artifact@v4
        with:
          name: preview-android
          path: |
            AZ-RemoteConnect-Viewer-debug.apk
            AZ-RemoteConnect-Full-Play-signed.aab
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Windows application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python branding/build_icons.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: dotnet publish windows/AZRemoteConnect.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/windows
      - shell: pwsh
        run: |
          Copy-Item publish/windows/AZRemoteConnect.exe AZ-RemoteConnect-Windows-x64.exe
          Compress-Archive -Path publish/windows/* -DestinationPath AZ-RemoteConnect-Windows-complete.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: |
            AZ-RemoteConnect-Windows-x64.exe
            AZ-RemoteConnect-Windows-complete.zip
          if-no-files-found: error
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: release
      - name: Verify and checksum
        run: |
          test -s release/AZ-RemoteConnect-Viewer-debug.apk
          test -s release/AZ-RemoteConnect-Windows-x64.exe
          test -s release/AZ-RemoteConnect-Windows-complete.zip
          cd release && sha256sum AZ-RemoteConnect-* > SHA256SUMS.txt
      - name: Publish safer viewer distribution preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.4.1-connection-fix.${GITHUB_RUN_NUMBER}"
          FILES=(release/AZ-RemoteConnect-Viewer-debug.apk release/AZ-RemoteConnect-Windows-x64.exe release/AZ-RemoteConnect-Windows-complete.zip release/SHA256SUMS.txt)
          if [ -s release/AZ-RemoteConnect-Full-Play-signed.aab ]; then
            FILES+=(release/AZ-RemoteConnect-Full-Play-signed.aab)
          fi
          gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "AZ RemoteConnect Connection Stability Fix $GITHUB_RUN_NUMBER" --notes "CONNECTION STABILITY FIX: Android host only shows READY and six-digit code after encrypted listener binds, with stage-specific errors for TLS, pairing, approval and streaming; Windows replaces opaque EOF with recovery steps. Keep phone screen sharing alive, verify local IP, and approve the notification. Windows blue dashboard retained. Windows UI inspired by the user supplied remote access dashboard image, with live Android phone preview, screen-touch/touchpad modes, fullscreen, and one six-digit pairing code typed into Windows. A first-use TLS trust confirmation is required, thereafter the full certificate fingerprint is saved and checked automatically. First pairing is vulnerable to active impersonation on hostile networks. Android remote-touch requires a Full Android edition with consent (the published Viewer APK cannot receive remote touches). Android-to-Windows audio and file transfer are not implemented. Windows EXE is unsigned; Android Viewer APK is debug-signed. Do not publicly forward TCP port 48765." --prerelease
