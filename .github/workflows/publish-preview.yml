name: Publish AZ RemoteConnect Preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate AZ RemoteConnect icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python branding/build_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available from Google.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p android --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AZ-RemoteConnect-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: preview-android
          path: AZ-RemoteConnect-Android-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: dotnet publish windows/AZRemoteConnect.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/windows
      - shell: pwsh
        run: |
          Copy-Item publish/windows/AZRemoteConnect.exe AZ-RemoteConnect-Windows-x64.exe
          Compress-Archive -Path publish/windows/* -DestinationPath AZ-RemoteConnect-Windows-complete.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: |
            AZ-RemoteConnect-Windows-x64.exe
            AZ-RemoteConnect-Windows-complete.zip
          if-no-files-found: error
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: release
      - name: Verify and checksum
        run: |
          test -s release/AZ-RemoteConnect-Android-debug.apk
          test -s release/AZ-RemoteConnect-Windows-x64.exe
          test -s release/AZ-RemoteConnect-Windows-complete.zip
          cd release && sha256sum AZ-RemoteConnect-* > SHA256SUMS.txt
      - name: Publish branded AZ RemoteConnect preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.2.0-branded.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/AZ-RemoteConnect-Android-debug.apk release/AZ-RemoteConnect-Windows-x64.exe release/AZ-RemoteConnect-Windows-complete.zip release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "AZ RemoteConnect — Blue A Icon Preview $GITHUB_RUN_NUMBER" --notes "BRANDED PREVIEW: Includes the approved blue remote-control A launcher icon (Android and Windows), LAN remote screen sharing and experimental remote input, audio and Android hosting. This is not certified for public-internet exposure. Android APK is debug-signed; Windows EXE is unsigned. The Windows ZIP includes supporting runtime files." --prerelease
