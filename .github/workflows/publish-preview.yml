name: Publish AZ RemoteConnect Preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available from Google.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p android --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AZ-RemoteConnect-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: preview-android
          path: AZ-RemoteConnect-Android-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: dotnet publish windows/AZRemoteConnect.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/windows
      - shell: pwsh
        run: Copy-Item publish/windows/AZRemoteConnect.exe AZ-RemoteConnect-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: AZ-RemoteConnect-Windows-x64.exe
          if-no-files-found: error
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: release
      - name: Verify and checksum
        run: |
          test -s release/AZ-RemoteConnect-Android-debug.apk
          test -s release/AZ-RemoteConnect-Windows-x64.exe
          cd release && sha256sum AZ-RemoteConnect-* > SHA256SUMS.txt
      - name: Publish explicitly labeled foundation preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.1.0-foundation.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/AZ-RemoteConnect-Android-debug.apk release/AZ-RemoteConnect-Windows-x64.exe release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "AZ RemoteConnect Foundation Preview $GITHUB_RUN_NUMBER" --notes "PREVIEW ONLY. These are starter apps; remote screen sharing, device pairing, remote input and internet connections are NOT implemented. Android artifact is a debug-signed APK. Windows artifact is not code-signed." --prerelease
