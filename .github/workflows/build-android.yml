name: Build Android APK
on:
  push:
    branches: [main, 'chore/**', 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate AZ RemoteConnect icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python branding/build_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available from Google.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK Platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build safer viewer APK and full-capability AAB (unsigned without signing key)
        run: gradle -p android --no-daemon assembleViewerDebug bundleFullRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AZ-RemoteConnect-Viewer-debug
          path: android/app/build/outputs/apk/viewer/debug/app-viewer-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AZ-RemoteConnect-Full-AAB-unsigned
          path: android/app/build/outputs/bundle/fullRelease/app-full-release.aab
          if-no-files-found: error
